<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Asesmen - Sikutaki.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b1329] text-gray-100 min-h-screen font-sans">
    
    <!-- Header -->
    <header class="border-b border-gray-800 bg-[#131e3a] px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center font-bold text-[#0b1329]">S</div>
            <h1 class="text-xl font-bold tracking-wide">Sikutaki<span class="text-emerald-400">.com Laporan</span></h1>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-xs text-gray-300">Hasil Analisis untuk <strong class="text-emerald-400">{{ username }}</strong></span>
            <a href="/" class="text-xs bg-emerald-500 text-[#0b1329] font-bold px-4 py-2 rounded-xl hover:bg-emerald-400 transition">Lanjut ke AI Companion</a>
        </div>
    </header>

    <!-- Report Content -->
    <main class="max-w-4xl mx-auto p-6 mt-6">
        <div class="bg-[#131e3a] p-8 rounded-2xl border border-gray-800 shadow-xl space-y-6">
            <div class="border-b border-gray-800 pb-4">
                <h2 class="text-2xl font-bold text-emerald-400">📋 Laporan Komprehensif Multi-Agent Sikutaki</h2>
                <p class="text-xs text-gray-400 mt-1">Laporan ini memuat temuan fisik, mental, serta korelasi psikosomatik yang dihasilkan oleh sistem AI.</p>
            </div>

            <div class="bg-gray-900/80 p-6 rounded-xl border border-gray-800 text-sm leading-relaxed whitespace-pre-line text-gray-200">
                {{ report }}
            </div>

            <div class="flex justify-end gap-4 pt-4">
                <a href="/assessment" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-5 py-3 rounded-xl border border-gray-700 transition">Ulangi Asesmen</a>
                <a href="/" class="bg-emerald-500 hover:bg-emerald-400 text-[#0b1329] font-bold text-xs px-6 py-3 rounded-xl transition shadow-lg shadow-emerald-500/10">Mulai Sesi Konseling AI Companion →</a>
            </div>
        </div>
    </main>
</body>
</html>
