<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — SIKUTAKI.AI</title>
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                        data: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        background: 'var(--background)',
                        foreground: 'var(--foreground)',
                        sidebar: 'var(--sidebar)',
                        emeraldaccent: '#10b981',
                        primary: 'var(--primary)',
                        'primary-foreground': 'var(--primary-foreground)',
                        muted: 'var(--muted)',
                        'muted-foreground': 'var(--muted-foreground)',
                        border: 'var(--border)',
                        card: 'var(--card)',
                        'card-foreground': 'var(--card-foreground)',
                        success: 'var(--success)',
                        warning: 'var(--warning)',
                        destructive: 'var(--destructive)',
                        secondary: 'var(--secondary)'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --background: #f1f5f9;
            --foreground: #0f172a;
            --primary: #059669;
            --primary-foreground: #ecfdf5;
            --secondary: #e2e8f0;
            --secondary-foreground: #1e293b;
            --accent: #0d9488;
            --accent-foreground: #f0fdfa;
            --muted: #e8eef5;
            --muted-foreground: #475569;
            --card: #ffffff;
            --card-foreground: #0f172a;
            --border: #cbd5e1;
            --input: #cbd5e1;
            --ring: #059669;
            --glow: rgba(16, 185, 129, 0.35);
        }

        .dark {
            --background: #070d1b;
            --foreground: #e2e8f0;
            --primary: #10b981;
            --primary-foreground: #04120d;
            --secondary: #1e293b;
            --secondary-foreground: #e2e8f0;
            --accent: #2dd4bf;
            --accent-foreground: #042f2a;
            --muted: #111a2e;
            --muted-foreground: #94a3b8;
            --card: #0f172a;
            --card-foreground: #e2e8f0;
            --border: #1e293b;
            --input: #263349;
            --ring: #10b981;
            --glow: rgba(16, 185, 129, 0.55);
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .hologram-container {
            animation: hologramGlow 3s ease-in-out infinite;
        }
        .blob-primary {
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
            filter: blur(60px);
        }

        @keyframes hologramGlow {
            0%, 100% {
                filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.6)) drop-shadow(0 0 20px rgba(52, 211, 153, 0.4));
                opacity: 0.92;
            }
            50% {
                filter: drop-shadow(0 0 14px rgba(16, 185, 129, 0.9)) drop-shadow(0 0 28px rgba(52, 211, 153, 0.7));
                opacity: 1;
            }
        }
        .ribbon-beam {
            stroke-dasharray: 90 910;
            animation: ribbonTravel 5s linear infinite;
        }
        .ribbon-glow {
            animation: ribbonPulse 3.2s ease-in-out infinite;
        }
        @keyframes ribbonTravel {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -1000; }
        }
        @keyframes ribbonPulse {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.35)); opacity: 0.55; }
            50% { filter: drop-shadow(0 0 22px rgba(16, 185, 129, 0.8)); opacity: 0.9; }
        }
    </style>
</head>
<body class="bg-background text-foreground min-h-screen flex items-center justify-center p-4 relative overflow-hidden transition-colors duration-300">

    <!-- RIBBON WATERMARK BACKGROUND -->
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 z-0 flex items-center justify-center overflow-hidden">
        <div class="blob-primary absolute h-[520px] w-[520px] opacity-30"></div>
        <svg viewBox="0 0 400 560" class="ribbon-glow h-[78vh] max-h-[760px] w-auto opacity-60" fill="none">
            <path d="M310 70 C 200 20, 70 70, 110 160 C 150 245, 300 250, 300 345 C 300 445, 160 500, 80 465" stroke="var(--primary)" stroke-opacity="0.18" stroke-width="38" stroke-linecap="round"></path>
            <path d="M310 70 C 200 20, 70 70, 110 160 C 150 245, 300 250, 300 345 C 300 445, 160 500, 80 465" stroke="var(--primary)" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"></path>
            <path class="ribbon-beam" pathLength="1000" d="M310 70 C 200 20, 70 70, 110 160 C 150 245, 300 250, 300 345 C 300 445, 160 500, 80 465" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"></path>
        </svg>
    </div>

    <!-- TOMBOL SKEMA TEMA -->
    <div class="absolute top-4 right-4 z-20">
        <button type="button" onclick="toggleTheme()" aria-label="Ganti Tema" class="flex items-center gap-2 rounded-xl border border-border bg-card/80 backdrop-blur px-3 py-2 text-xs font-semibold text-foreground transition-all duration-150 hover:border-primary/40 active:scale-95 shadow-md">
            <span id="themeLabel">🌙 Mode Gelap</span>
        </button>
    </div>

    <!-- CARD LOGIN COMPONENT (BERDASARKAN LAYOUT SIKUTAKI.COM DENGAN TEMA KITA) -->
    <main class="relative z-10 w-full max-w-md">
        <div class="bg-card/90 backdrop-blur-md border border-border rounded-2xl p-8 shadow-2xl space-y-6">
            
            <!-- HEADER LOGO & JUDUL -->
            <div class="flex flex-col items-center text-center space-y-2">
                <div class="hologram-container w-16 h-16 flex items-center justify-center mb-1">
                    <img src="/static/logo-sikutaki.png" onerror="this.parentElement.innerHTML='<div class=\'w-12 h-12 rounded-2xl bg-emeraldaccent flex items-center justify-center font-bold text-slate-950 text-xl shadow-lg\'>S</div>';" alt="Logo" class="w-full h-full object-contain">
                </div>
                <h1 class="text-xl font-bold tracking-tight text-foreground">
                    Masuk ke <span class="text-foreground">Sikutaki</span><span class="text-primary">.ai</span>
                </h1>
                <p class="text-xs text-muted-foreground">
                    Platform Kesehatan Holistik & AI Companion
                </p>
            </div>

            <!-- FORM LOGIN -->
            <form action="/login" method="POST" class="space-y-4 text-xs">
                <div class="space-y-1.5">
                    <label for="email" class="block font-medium text-foreground">Email</label>
                    <input type="email" id="email" name="email" required placeholder="nama@email.com" class="w-full bg-muted border border-border text-foreground rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-emeraldaccent focus:ring-1 focus:ring-emeraldaccent transition">
                </div>

                <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                        <label for="password" class="block font-medium text-foreground">Kata Sandi</label>
                    </div>
                    <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full bg-muted border border-border text-foreground rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-emeraldaccent focus:ring-1 focus:ring-emeraldaccent transition">
                </div>

                <button type="submit" class="w-full py-3 mt-2 bg-emeraldaccent hover:opacity-95 text-slate-950 font-extrabold rounded-xl text-xs transition shadow-lg flex items-center justify-center gap-2 active:scale-[0.99]">
                    Masuk ke Dashboard
                </button>
            </form>

            <!-- FOOTER REGISTER LINK -->
            <div class="text-center text-xs text-muted-foreground pt-2 border-t border-border/50">
                Belum punya akun? <a href="/register" class="text-primary hover:underline font-semibold">Daftar di sini</a>
            </div>

        </div>

        <!-- FOOTER DISCLOSURE -->
        <p class="text-center font-data text-[9px] uppercase tracking-widest text-muted-foreground mt-6">
            SIKUTAKI.AI · Collaborating Intelligence
        </p>
    </main>

    <!-- SCRIPT TEMA -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const storedTheme = window.localStorage?.getItem('sikutaki-theme');
            if (storedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                const label = document.getElementById('themeLabel');
                if (label) label.innerText = "☀️ Mode Terang";
            }
        });

        function toggleTheme() {
            const html = document.documentElement;
            const label = document.getElementById('themeLabel');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                if(label) label.innerText = "☀️ Mode Terang";
                window.localStorage?.setItem('sikutaki-theme', 'light');
            } else {
                html.classList.add('dark');
                if(label) label.innerText = "🌙 Mode Gelap";
                window.localStorage?.setItem('sikutaki-theme', 'dark');
            }
        }
    </script>
</body>
</html>
